<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Orchestrate Execution: Make every agent count</title>
  <desc id="desc">A focused request moves through planning, two distinct work paths, and a shared check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A7F3D0"/>
    </marker>
  </defs>
  <rect width="1280" height="480" fill="#0B1020"/>
  <path d="M626 48V432" stroke="#253047" stroke-width="1"/>
  <circle cx="1176" cy="73" r="126" fill="none" stroke="#18233A" stroke-width="1"/>
  <circle cx="1176" cy="73" r="91" fill="none" stroke="#18233A" stroke-width="1"/>
  <text x="72" y="83" fill="#A7F3D0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">ORCHESTRATE EXECUTION</text>
  <text x="72" y="176" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Make every</text>
  <text x="72" y="254" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-2">agent count.</text>
  <text x="75" y="328" fill="#C8D2E3" font-family="Segoe UI,Arial,sans-serif" font-size="28">Turn a coding request into focused work</text>
  <text x="75" y="369" fill="#C8D2E3" font-family="Segoe UI,Arial,sans-serif" font-size="28">and a checked result.</text>
  <rect x="72" y="413" width="239" height="38" rx="19" fill="#131C30" stroke="#33425B"/>
  <circle cx="94" cy="432" r="5" fill="#D5F879"/>
  <text x="110" y="439" fill="#9BAAC2" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">CODEX SKILL  /  OPEN SOURCE</text>

  <path d="M776 250H800" fill="none" stroke="#A7F3D0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M900 250H925V176H945" fill="none" stroke="#A7F3D0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M900 250H925V324H945" fill="none" stroke="#D5F879" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1085 176H1098V250H1110" fill="none" stroke="#A7F3D0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1085 324H1098V250H1110" fill="none" stroke="#D5F879" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="646" y="210" width="130" height="80" rx="15" fill="#11192B" stroke="#394761" stroke-width="1.5"/>
  <text x="711" y="241" text-anchor="middle" fill="#9BAAC2" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.4">REQUEST</text>
  <text x="711" y="272" text-anchor="middle" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">One brief</text>

  <rect x="800" y="210" width="100" height="80" rx="15" fill="#141E32" stroke="#688272" stroke-width="1.5"/>
  <circle cx="850" cy="233" r="12" fill="#1D322D"/>
  <text x="850" y="239" text-anchor="middle" fill="#A7F3D0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">01</text>
  <text x="850" y="272" text-anchor="middle" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">PLAN</text>

  <rect x="945" y="136" width="140" height="80" rx="15" fill="#131D31" stroke="#3D6C63" stroke-width="1.5"/>
  <circle cx="967" cy="158" r="5" fill="#A7F3D0"/>
  <text x="1015" y="172" text-anchor="middle" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Focus A</text>
  <text x="1015" y="198" text-anchor="middle" fill="#9BAAC2" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.3">WORK</text>

  <rect x="945" y="284" width="140" height="80" rx="15" fill="#1A211F" stroke="#73824A" stroke-width="1.5"/>
  <circle cx="967" cy="306" r="5" fill="#D5F879"/>
  <text x="1015" y="320" text-anchor="middle" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Focus B</text>
  <text x="1015" y="346" text-anchor="middle" fill="#9BAAC2" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.3">WORK</text>

  <rect x="1110" y="210" width="110" height="80" rx="15" fill="#172B28" stroke="#A7F3D0" stroke-width="1.8"/>
  <circle cx="1132" cy="232" r="5" fill="#D5F879"/>
  <text x="1165" y="260" text-anchor="middle" fill="#F4F7FC" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">CHECK</text>
  <text x="1165" y="281" text-anchor="middle" fill="#A7F3D0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">RESULT</text>
</svg>
